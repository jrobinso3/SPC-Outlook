<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="radar-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect width="64" height="64" rx="16" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Radar rings -->
  <circle cx="32" cy="32" r="22" stroke="#38bdf8" stroke-opacity="0.15" stroke-width="1.5" fill="none"/>
  <circle cx="32" cy="32" r="14" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.5" fill="none"/>
  <circle cx="32" cy="32" r="6" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.5" fill="none"/>

  <!-- Radar sweep wedge -->
  <path d="M32 32 L54 32 A22 22 0 0 0 32 10 Z" fill="url(#radar-glow)"/>

  <!-- Severe weather warning lightning bolt -->
  <path d="M34 14 L20 34 H31 L28 50 L44 28 H33 Z" fill="url(#bolt)" filter="url(#glow)"/>
</svg>
